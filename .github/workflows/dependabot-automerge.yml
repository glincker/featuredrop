name: Dependabot auto-merge

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Approve and auto-merge safe updates
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Decide if this update is safe to auto-merge
        id: decision
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEP_TYPE: ${{ steps.metadata.outputs.dependency-type }}
        run: |
          # Auto-merge patch/minor bumps of any kind, and any dev-dependency bump
          # regardless of bump size. Production major/minor bumps always stay manual.
          if [[ "$UPDATE_TYPE" == "version-update:semver-patch" || "$UPDATE_TYPE" == "version-update:semver-minor" ]]; then
            echo "safe=true" >> "$GITHUB_OUTPUT"
          elif [[ "$DEP_TYPE" == "direct:development" || "$DEP_TYPE" == "indirect" ]]; then
            echo "safe=true" >> "$GITHUB_OUTPUT"
          else
            echo "safe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for CI checks to pass
        if: steps.decision.outputs.safe == 'true'
        # main has no required-status-check branch protection configured, so
        # auto-merge alone would not reliably wait for CI. Block here instead.
        run: gh pr checks "$PR_URL" --watch --fail-fast
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve PR
        if: steps.decision.outputs.safe == 'true'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge
        if: steps.decision.outputs.safe == 'true'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
